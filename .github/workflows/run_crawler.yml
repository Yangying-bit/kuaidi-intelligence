name: 快递情报自动抓取与AI分析

on:
  schedule:
    # 表达式代表每隔 2 小时自动运行一次
    - cron: '0 */2 * * *'
  workflow_dispatch: # 允许你随时在网页上手动点一下立刻运行

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行爬虫与AI分析引擎
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} # 自动从你的保险箱提取 Key
      run: python crawler_engine.py

    - name: 自动保存数据库更新到云端
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add intelligence.db || true
        git commit -m "auto: 更新最新情报数据库 [skip ci]" || true
        git push || true
