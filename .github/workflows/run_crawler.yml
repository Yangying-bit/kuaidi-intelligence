name: 快递情报 ETL 流水线

on:
  schedule:
    # 国际标准时间 (UTC)：每隔 2 小时，在第 17 分钟触发 (换算为北京时间是 08:17, 10:17 等)
    - cron: '17 */2 * * *'
  workflow_dispatch:

# 避免多个任务同时运行导致重复抓取
concurrency:
  group: news-crawler-database
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 步骤 1：全网极速抓取 (Extract & Load)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python 1_spider.py

      - name: 步骤 2：大模型异步分析队列 (Transform)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python 2_ai_worker.py
